name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/user-profile-and-account]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Edge Functions
        run: deno check supabase/functions/cleanup-group-images/index.ts
      - name: Build
        run: npm run build

  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply all migrations from a clean database
        run: supabase db reset --local --no-seed
      - name: Test Group Creator, Group Admin and plan entitlements
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_creator_admin_entitlements.test.sql
      - name: Test group membership lifecycle
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_membership_lifecycle.test.sql
      - name: Test group deletion financial safeguards and reactivation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_deletion_safety.test.sql
      - name: Test approval-based group invitation requests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_invitation_join_requests.test.sql
      - name: Test user profile contact and privacy isolation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/user_profile_privacy.test.sql
      - name: Test account settings owner-only theme preferences
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/account_settings.test.sql
      - name: Test account deletion gates and anonymisation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_safety.test.sql
      - name: Test group notification mute and critical alert delivery
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_notification_mute.test.sql
      - name: Test confidential group reporting and moderation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_reporting.test.sql
      - name: Test creator-only group settings and metadata
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/group_settings.test.sql
