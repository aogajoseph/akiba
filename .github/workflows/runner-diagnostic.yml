name: Runner diagnostic

on:
  push:
    branches:
      - feat/user-profile-and-account
    paths:
      - .github/workflows/runner-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    name: GitHub-hosted runner smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Confirm runner started
        run: |
          echo "GitHub-hosted runner started successfully."
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
